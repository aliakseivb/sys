<div class="interviews-item" *ngIf="interview">
  <p class="interviews-item-place">
    {{interview.vacancyPlace}}

  </p>
  <h2 class="interviews-item-question">
    {{interview.question}}
  </h2>
  <div class="vacancies">
    <p class="vacancies-name" *ngFor="let vacancyName of interview.vacancyName">{{vacancyName}}</p>
  </div>
  <div class="reactions-box">
    <div class="reactions-item save">
      <svg width="11.666504" height="15.000000" viewBox="0 0 11.6665 15" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <path id="Vector"
              d="M10 0L1.66 0C0.75 0 0 0.75 0 1.66L0 15L5.83 12.5L11.66 15L11.66 1.66C11.66 0.75 10.91 0 10 0ZM10 12.5L5.83 10.68L1.66 12.5L1.66 1.66L10 1.66L10 12.5Z"
              fill="#AEAEAE" fill-opacity="1.000000" fill-rule="nonzero"/>
      </svg>
      <span>Save</span>
    </div>
    <div class="reactions-item quantity-answers">
      <svg width="16.666504" height="16.666748" viewBox="0 0 16.6665 16.6667" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <path id="Vector"
              d="M1.66 1.66L15 1.66L15 11.66L2.64 11.66L1.66 12.64L1.66 1.66ZM1.66 0C0.75 0 0 0.75 0 1.66L0 16.66L3.33 13.33L15 13.33C15.91 13.33 16.66 12.58 16.66 11.66L16.66 1.66C16.66 0.75 15.91 0 15 0L1.66 0ZM3.33 8.33L13.33 8.33L13.33 10L3.33 10L3.33 8.33ZM3.33 5.83L13.33 5.83L13.33 7.5L3.33 7.5L3.33 5.83ZM3.33 3.33L13.33 3.33L13.33 5L3.33 5L3.33 3.33Z"
              fill="#AEAEAE" fill-opacity="1.000000" fill-rule="nonzero"/>
      </svg>
      <div class="quantity-answers-num"><span>{{interview.otherAnswers.amount}}</span>answers</div>
    </div>
    <div class="reactions-item was-asked">
      <svg width="19.000000" height="19.000000" viewBox="0 0 19 19" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <path id="+"
              d="M12.3 9.42L9.92 9.42L9.92 6.93L8.83 6.93L8.83 9.42L6.45 9.42L6.45 10.44L8.83 10.44L8.83 13.14L9.92 13.14L9.92 10.44L12.3 10.44L12.3 9.42Z"
              fill="#AEAEAE" fill-opacity="1.000000" fill-rule="evenodd"/>
        <circle id="Ellipse 7817" cx="9.500000" cy="9.500000" r="9.000000" stroke="#AEAEAE"
                stroke-opacity="1.000000" stroke-width="1.000000"/>
      </svg>
      <span>I was asked this</span>
    </div>
  </div>
  <div class="users-image-box">
    <img style="width: 24px" src="./assets/images/page/main/face-1.png" alt="Face">
    <img style="width: 24px" src="./assets/images/page/main/face-2.png" alt="Face">
    <span class="users-image-box-text">Clarify “What do you mean by favourite product? Are you thinking...</span>
  </div>
</div>
